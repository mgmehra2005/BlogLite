{% extends 'dashboard.html' %} 

{% block title %} Blogs Panel {% endblock %} 

{% block dashboard_content %}

    <h1 class="text-[32px] font-bold pb-8 uppercase">Your Blogs</h1>
    <table>
        <thead>
            <tr class="bg-black/40 text-white rounded-2xl text-left">
                <th class="py-1 pl-4 text-left">Title</th>
                <th></th>
            </tr>
        </thead>
        <tbody class="divide-y-1">
            {% if posts %}
                {% for post in posts %}
                    <tr class="hover:bg-black/10 duration-500"">
                        <td class="py-2 pl-2"><a href="{{url_for('blog.fetch_post', post_id=post.id)}}">{{post.title}}</a></td>
                        <td class="cursor-pointer text-center py-2 bg-red-500 font-medium text-white" onclick="verify_delete('{{ url_for("blog.delete_post", pid=post.id) }}')">Delete</td>
                    </tr>        
                {% endfor %}
            {% endif %}
            
        </tbody>
    </table>
    <script>
        verify_delete = (location) => {
                                let user_confirmation = confirm('Do you want to delete this Post.');
                                if (user_confirmation) {
                                    window.location.href=location;
                                }
                            }
    </script>
{% endblock %}
